name: Campus Pre-Order Request
description: Submit a stationery pre-order or custom printout to the campus store
title: "[Order] PFX-2026-XXXXX: Student Name"
labels: ["new-order"]
body:
  - type: markdown
    attributes:
      value: |
        ### Pencil FX Pre-Order Registration
        This issue was automatically formatted by the Pencil FX campus pre-order web application.
        Submitting this issue will trigger the automated GitHub Actions backend to record your order in `data/orders.json` and reserve your pickup slot.
  - type: textarea
    id: order_payload
    attributes:
      label: Order Payload (JSON)
      description: The structured order data generated by Pencil FX. Please do not modify this block.
      render: json
    validations:
      required: true
  - type: input
    id: order_id
    attributes:
      label: Order ID (PFX-YYYY-XXXXX)
    validations:
      required: true
  - type: input
    id: student_id
    attributes:
      label: Student Session ID
    validations:
      required: true
  - type: input
    id: pickup_slot
    attributes:
      label: Requested Pickup Slot
    validations:
      required: true
  - type: textarea
    id: student_notes
    attributes:
      label: Additional Notes & Instructions
